name: Release Backend

on:
  release:
    types: [ created ]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configurer les dépôts Maven
        env:
          FABRICATEUR_USERNAME: ${{ secrets.FABRICATEUR_USERNAME }}
          FABRICATEUR_TOKEN: ${{ secrets.FABRICATEUR_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings>
            <servers>
              <server>
                <id>github-fabricateur</id>
                <username>${FABRICATEUR_USERNAME}</username>
                <password>${FABRICATEUR_TOKEN}</password>
              </server>
              <server>
                <id>github</id>
                <username>${FABRICATEUR_USERNAME}</username>
                <password>${FABRICATEUR_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Build backend
        env:
          FABRICATEUR_USERNAME: ${{ secrets.FABRICATEUR_USERNAME }}
          FABRICATEUR_TOKEN: ${{ secrets.FABRICATEUR_TOKEN }}
        run: mvn -B package -DskipSlowTests=slow --file pom.xml

      - name: Upload jar serveur dans la release
        uses: softprops/action-gh-release@v2
        with:
          files: serveur/target/fabrique-serveur.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
