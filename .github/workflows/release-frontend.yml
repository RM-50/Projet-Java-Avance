name: Release Frontend

on:
  release:
    types: [ created ]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build frontend
        run: mvn -B package --file pom.xml

      - name: Upload jar frontend dans la release
        uses: softprops/action-gh-release@v2
        with:
          files: target/fabrique-frontend.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
