name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github-fabricateur
          server-username: FABRICATEUR_USERNAME
          server-password: FABRICATEUR_TOKEN

      - name: Build and test
        env:
          FABRICATEUR_USERNAME: ${{ secrets.FABRICATEUR_USERNAME }}
          FABRICATEUR_TOKEN: ${{ secrets.FABRICATEUR_TOKEN }}
        run: mvn -B verify
